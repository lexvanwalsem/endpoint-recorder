<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surveyor</title>
<link rel="icon" type="image/svg+xml" href="icons/icon-small.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<header>
  <img class="logo" src="icons/icon-48.png" width="34" height="34" alt="">
  <h1>Surveyor</h1>
  <div id="summary"></div>
  <span class="spacer"></span>
  <div class="actions">
    <button id="exportMd" title="Markdown of the endpoints that match the filters">Export Markdown</button>
    <button id="exportJson" title="JSON of the endpoints that match the filters">Export JSON</button>
    <button id="clear" class="danger">Clear all</button>
  </div>
</header>
<main>
  <section id="left">
    <div class="modebar"><div class="seg" id="mode"><button data-mode="endpoints" class="active">Endpoints</button><button data-mode="steps">Steps</button></div></div>
    <div class="filters">
      <input id="q" type="search" placeholder="Search path, host, field name or example value">
      <div class="selects">
        <select id="method"><option value="">All methods</option></select>
        <select id="host"><option value="">All hosts</option></select>
        <select id="type"><option value="">All types</option></select>
        <select id="sort">
          <option value="count">Most calls</option>
          <option value="avg">Slowest</option>
          <option value="recent">Most recent</option>
          <option value="name">Name</option>
        </select>
      </div>
      <div class="row">
        <label><input id="errorsOnly" type="checkbox"> Only errors</label>
        <label><input id="withBody" type="checkbox"> Only with JSON body</label>
        <span id="count" class="muted" style="margin-left:auto"></span>
      </div>
    </div>
    <div id="list"></div>
  </section>
  <section id="right"></section>
</main>
<script type="module" src="viewer.js"></script>
</body>
</html>
